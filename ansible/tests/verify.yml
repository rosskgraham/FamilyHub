# Checks the stand-in ended up as the Pi should.
- name: Check the Pi is set up
  hosts: hub
  become: true
  tasks:
    - name: Read SSH's settings
      ansible.builtin.command: sshd -T
      register: sshd
      changed_when: false

    - name: Check SSH takes keys only, and never root
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshd.stdout_lines"
          - "'permitrootlogin no' in sshd.stdout_lines"
          - "'pubkeyauthentication yes' in sshd.stdout_lines"

    - name: Read the firewall's state
      ansible.builtin.command: ufw status verbose
      register: ufw
      changed_when: false

    - name: Check the firewall is on and only lets SSH in
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw.stdout"
          - "'deny (incoming)' in ufw.stdout"
          - "ufw.stdout is search('22/tcp +LIMIT IN')"
          - "ufw.stdout_lines | select('search', 'ALLOW IN|LIMIT IN') | reject('search', '^22/tcp') | list | length == 0"

    - name: Read apt's settings
      ansible.builtin.command: apt-config dump
      register: apt_config
      changed_when: false

    - name: Check updates install themselves and restart the Pi while the Hub sleeps
      ansible.builtin.assert:
        that:
          - "'APT::Periodic::Unattended-Upgrade \"1\";' in apt_config.stdout_lines"
          - "'Unattended-Upgrade::Automatic-Reboot \"true\";' in apt_config.stdout_lines"
          - "'Unattended-Upgrade::Automatic-Reboot-Time \"03:30\";' in apt_config.stdout_lines"
          - "apt_config.stdout is search('Origins-Pattern:: \"origin=Raspberry Pi Foundation')"

    - name: Check apt downloads over IPv4
      ansible.builtin.assert:
        that: "'Acquire::ForceIPv4 \"true\";' in apt_config.stdout_lines"

    - name: Read the time zone
      ansible.builtin.command: readlink -f /etc/localtime
      register: localtime
      changed_when: false

    - name: Check the time zone is UK time
      ansible.builtin.assert:
        that: localtime.stdout == '/usr/share/zoneinfo/Europe/London'

    - name: Read the Node.js version
      ansible.builtin.command: node --version
      register: node
      changed_when: false

    - name: Check Node.js is version 24
      ansible.builtin.assert:
        that: node.stdout.startswith('v24.')

    - name: Read the Hub's user
      ansible.builtin.getent:
        database: passwd
        key: familyhub

    - name: Check the Hub's user can't log in
      ansible.builtin.assert:
        that: ansible_facts.getent_passwd.familyhub[5] == '/usr/sbin/nologin'

    - name: Read the Hub's folders
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/opt/familyhub/releases, /var/lib/familyhub, /etc/familyhub]
      register: folders

    - name: Check only the Hub can read its data, and it can't change its code or config
      ansible.builtin.assert:
        that:
          - folders.results[0].stat.pw_name == 'root'
          - folders.results[1].stat.pw_name == 'familyhub' and folders.results[1].stat.mode == '0700'
          - folders.results[2].stat.pw_name == 'root' and folders.results[2].stat.gr_name == 'familyhub'
          - folders.results[2].stat.mode == '0750'

    - name: Ask the Hub for its health
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/health
      register: health

    - name: Check the Hub is running the release that was published
      ansible.builtin.assert:
        that: health.json.version == '2026.01.01.1'

    - name: Read what's listening
      ansible.builtin.command: ss --listening --tcp --numeric --no-header
      register: listening
      changed_when: false

    - name: Check the Hub only listens on the Pi itself
      ansible.builtin.assert:
        that: listening.stdout_lines | select('search', ':3000 ') | map('split') | map(attribute=3) | list == ['127.0.0.1:3000']

    - name: Read the Hub's, the updater's and the watchdog's units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop: [familyhub.service, familyhub-update.timer, familyhub-watchdog.timer]
      register: units

    - name: Check the Hub runs as its own user, starts with the Pi, and the updater and watchdog run
      ansible.builtin.assert:
        that:
          - units.results[0].status.User == 'familyhub'
          - units.results[0].status.ActiveState == 'active'
          - units.results | map(attribute='status.UnitFileState') | list == ['enabled', 'enabled', 'enabled']
          - units.results[1:] | map(attribute='status.ActiveState') | list == ['active', 'active']

    - name: Read the pretend Key Vault the tests use
      ansible.builtin.set_fact:
        vault: "{{ lookup('ansible.builtin.file', 'key_vault.json') | from_json }}"

    - name: Read the Hub's secrets file, and look for the old Household and Chores files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/familyhub/hub.env, /etc/familyhub/household.json, /etc/familyhub/chores.json]
      register: config_files

    # The pretend vault still has household-json, as the real one may until it's tidied up: the Household lives in
    # the Hub's database now (ADR 0012), so the playbook no longer copies it.
    - name: Check only root can read the secrets, and the Household and Chores aren't copied from the vault
      ansible.builtin.assert:
        that:
          - config_files.results[0].stat.pw_name == 'root' and config_files.results[0].stat.gr_name == 'root'
          - config_files.results[0].stat.mode == '0600'
          - "'household-json' in vault.secrets"
          - not config_files.results[1].stat.exists
          - not config_files.results[2].stat.exists

    - name: Read the Hub's own environment
      ansible.builtin.shell: tr '\0' '\n' < /proc/$(systemctl show --property=MainPID --value familyhub.service)/environ
      register: hub_environment
      changed_when: false
      no_log: true

    # What matters is what the Hub sees, after systemd has read hub.env's quoting.
    - name: Check the Hub sees the vault's secrets exactly, and only the ones it uses
      ansible.builtin.assert:
        that:
          - ('GOOGLE_CLIENT_ID=' ~ vault.secrets['google-client-id']) in hub_environment.stdout_lines
          - ('GOOGLE_CLIENT_SECRET=' ~ vault.secrets['google-client-secret']) in hub_environment.stdout_lines
          - ('NEST_PROJECT_ID=' ~ vault.secrets['nest-project-id']) in hub_environment.stdout_lines
          - "'HOME_LATITUDE=51.50' in hub_environment.stdout_lines"
          - hub_environment.stdout is not search('OCTOPUS|ZAPPI|InstrumentationKey')
        quiet: true

    - name: Read the kiosk's user
      ansible.builtin.getent:
        database: passwd
        key: kiosk

    - name: Read the kiosk's groups
      ansible.builtin.command: id --groups --name kiosk
      register: kiosk_groups
      changed_when: false

    - name: Check the kiosk's user can't log in, and can use the screen, the GPU and the touchscreen
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd.kiosk[5] == '/usr/sbin/nologin'
          - kiosk_groups.stdout.split() is superset(['video', 'render', 'input'])

    - name: Read the kiosk's and the first console's units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop: [familyhub-kiosk.service, getty@tty1.service, familyhub-screen.service]
      register: screen_units

    - name: Read what the Pi starts into
      ansible.builtin.command: systemctl get-default
      register: default_target
      changed_when: false

    - name: Check the Pi starts into the kiosk, as its own user, with no login prompt behind it
      ansible.builtin.assert:
        that:
          - screen_units.results[0].status.UnitFileState == 'enabled'
          - screen_units.results[0].status.User == 'kiosk'
          - screen_units.results[0].status.ExecStart is search('/usr/bin/cage -s -- /usr/local/lib/familyhub/kiosk.sh')
          - screen_units.results[1].status.UnitFileState == 'masked'
          # ProtectHome hides /run/user, where cage makes its Wayland socket.
          - screen_units.results[0].status.ProtectHome == 'no'
          - default_target.stdout == 'graphical.target'

    - name: Look for wlr-randr
      ansible.builtin.stat:
        path: /usr/bin/wlr-randr
      register: wlr_randr

    - name: Check the screen service starts with the Pi, as the kiosk's user, and can find cage and the touchscreen
      vars:
        screen: "{{ screen_units.results[2].status }}"
      ansible.builtin.assert:
        that:
          - screen.UnitFileState == 'enabled'
          - screen.User == 'kiosk'
          - screen.Restart == 'always'
          - screen.ExecStart is search('/usr/bin/node /usr/local/lib/familyhub/screen.mjs')
          - screen.Environment is search('XDG_RUNTIME_DIR=/run/user/' ~ ansible_facts.getent_passwd.kiosk[1])
          - screen.Environment is search('FAMILYHUB_TOUCHSCREEN=/dev/input/by-id/usb-ILITEK_ILITEK-TOUCH-event-if00')
          - screen.Environment is search('FAMILYHUB_URL=http://localhost:3000')
          - screen.ProtectHome == 'no'
          - wlr_randr.stat.exists

    - name: Check the rule that hides the pointer is installed and valid
      ansible.builtin.command: udevadm verify /etc/udev/rules.d/90-familyhub-touchscreen.rules
      changed_when: false

    - name: Read the rule that hides the pointer
      ansible.builtin.slurp:
        src: /etc/udev/rules.d/90-familyhub-touchscreen.rules
      register: pointer_rule

    # Both, or the pointer stays: either one is enough for Chromium and cage to think there's a mouse.
    - name: Check it ignores the touchscreen's pretend mouse and the HDMI ports' CEC inputs
      ansible.builtin.assert:
        that:
          - >-
            'ENV{ID_VENDOR_ID}=="222a", ENV{ID_INPUT_MOUSE}=="1", ENV{LIBINPUT_IGNORE_DEVICE}="1"'
            in (pointer_rule.content | b64decode)
          - >-
            'ATTRS{name}=="vc4-hdmi-*", ENV{LIBINPUT_IGNORE_DEVICE}="1"' in (pointer_rule.content | b64decode)

    - name: Read the boot settings
      ansible.builtin.slurp:
        src: /boot/firmware/config.txt
      register: boot_config

    - name: Read whether the old Wi-Fi settings are still there
      ansible.builtin.stat:
        path: /etc/NetworkManager/system-connections/familyhub-wifi.nmconnection
      register: wifi_file

    # The overlays come after an [all] of their own, so no [pi5] or other section above them can hide them.
    - name: Check the Wi-Fi and Bluetooth are switched off for every Pi, once, and the old Wi-Fi settings are gone
      ansible.builtin.assert:
        that:
          - lines | select('equalto', 'dtoverlay=disable-wifi') | list | length == 1
          - lines | select('equalto', 'dtoverlay=disable-bt') | list | length == 1
          - lines[lines.index('dtoverlay=disable-wifi') - 1] == '[all]'
          - lines[lines.index('dtoverlay=disable-bt') - 2] == '[all]'
          - "'dtparam=audio=on' in lines"
          - not wifi_file.stat.exists
      vars:
        lines: "{{ (boot_config.content | b64decode).splitlines() }}"

    - name: Read the journal's settings
      ansible.builtin.slurp:
        src: /etc/systemd/journald.conf.d/familyhub.conf
      register: journald

    - name: Check the journal is kept across restarts, and capped
      ansible.builtin.assert:
        that:
          - "'Storage=persistent' in lines"
          - "'SystemMaxUse=500M' in lines"
      vars:
        lines: "{{ (journald.content | b64decode).splitlines() }}"

    - name: Read the network check's unit
      ansible.builtin.systemd_service:
        name: familyhub-netcheck.service
      register: netcheck

    - name: Check the network check runs, starts with the Pi, and isn't root
      ansible.builtin.assert:
        that:
          - netcheck.status.ActiveState == 'active'
          - netcheck.status.UnitFileState == 'enabled'
          - netcheck.status.DynamicUser == 'yes'

    # It logs every state on its first round, a few seconds after starting.
    - name: Wait for the network check's first round
      ansible.builtin.command: journalctl -u familyhub-netcheck -b --no-pager -o cat
      register: netcheck_log
      changed_when: false
      until: netcheck_log.stdout is search('^default route:', multiline=True)
      retries: 10
      delay: 2

    - name: Check it said it started, and logged the route, the router and each public IP
      ansible.builtin.assert:
        that:
          - "netcheck_log.stdout is search('Network check started: every 5 s, logging only changes')"
          - "netcheck_log.stdout is search('^eth0 cable:', multiline=True)"
          - "netcheck_log.stdout is search('^router:', multiline=True)"
          - "netcheck_log.stdout is search('^internet 1\.1\.1\.1:', multiline=True)"
          - "netcheck_log.stdout is search('^internet 8\.8\.8\.8:', multiline=True)"
          - "netcheck_log.stdout is search('^internet 2606:4700:4700::1111:', multiline=True)"
          - "netcheck_log.stdout is search('^internet 2001:4860:4860::8888:', multiline=True)"
