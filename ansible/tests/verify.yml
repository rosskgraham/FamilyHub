# Checks the stand-in ended up as the Pi should.
- name: Check the Pi is set up
  hosts: hub
  become: true
  tasks:
    - name: Read SSH's settings
      ansible.builtin.command: sshd -T
      register: sshd
      changed_when: false

    - name: Check SSH takes keys only, and never root
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshd.stdout_lines"
          - "'permitrootlogin no' in sshd.stdout_lines"
          - "'pubkeyauthentication yes' in sshd.stdout_lines"

    - name: Read the firewall's state
      ansible.builtin.command: ufw status verbose
      register: ufw
      changed_when: false

    - name: Check the firewall is on and only lets SSH in
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw.stdout"
          - "'deny (incoming)' in ufw.stdout"
          - "ufw.stdout is search('22/tcp +LIMIT IN')"
          - "ufw.stdout_lines | select('search', 'ALLOW IN|LIMIT IN') | reject('search', '^22/tcp') | list | length == 0"

    - name: Read apt's settings
      ansible.builtin.command: apt-config dump
      register: apt_config
      changed_when: false

    - name: Check updates install themselves and restart the Pi while the Hub sleeps
      ansible.builtin.assert:
        that:
          - "'APT::Periodic::Unattended-Upgrade \"1\";' in apt_config.stdout_lines"
          - "'Unattended-Upgrade::Automatic-Reboot \"true\";' in apt_config.stdout_lines"
          - "'Unattended-Upgrade::Automatic-Reboot-Time \"03:30\";' in apt_config.stdout_lines"
          - "apt_config.stdout is search('Origins-Pattern:: \"origin=Raspberry Pi Foundation')"

    - name: Read the time zone
      ansible.builtin.command: readlink -f /etc/localtime
      register: localtime
      changed_when: false

    - name: Check the time zone is UK time
      ansible.builtin.assert:
        that: localtime.stdout == '/usr/share/zoneinfo/Europe/London'

    - name: Read the Node.js version
      ansible.builtin.command: node --version
      register: node
      changed_when: false

    - name: Check Node.js is version 24
      ansible.builtin.assert:
        that: node.stdout.startswith('v24.')

    - name: Read the Hub's user
      ansible.builtin.getent:
        database: passwd
        key: familyhub

    - name: Check the Hub's user can't log in
      ansible.builtin.assert:
        that: ansible_facts.getent_passwd.familyhub[5] == '/usr/sbin/nologin'

    - name: Read the Hub's folders
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/opt/familyhub/releases, /var/lib/familyhub, /etc/familyhub]
      register: folders

    - name: Check only the Hub can read its data, and it can't change its code or config
      ansible.builtin.assert:
        that:
          - folders.results[0].stat.pw_name == 'root'
          - folders.results[1].stat.pw_name == 'familyhub' and folders.results[1].stat.mode == '0700'
          - folders.results[2].stat.pw_name == 'root' and folders.results[2].stat.gr_name == 'familyhub'
          - folders.results[2].stat.mode == '0750'

    - name: Ask the Hub for its health
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/health
      register: health

    - name: Check the Hub is running the release that was published
      ansible.builtin.assert:
        that: health.json.version == '2026.01.01.1'

    - name: Read what's listening
      ansible.builtin.command: ss --listening --tcp --numeric --no-header
      register: listening
      changed_when: false

    - name: Check the Hub only listens on the Pi itself
      ansible.builtin.assert:
        that: listening.stdout_lines | select('search', ':3000 ') | map('split') | map(attribute=3) | list == ['127.0.0.1:3000']

    - name: Read the Hub's, the updater's and the watchdog's units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop: [familyhub.service, familyhub-update.timer, familyhub-watchdog.timer]
      register: units

    - name: Check the Hub runs as its own user, starts with the Pi, and the updater and watchdog run
      ansible.builtin.assert:
        that:
          - units.results[0].status.User == 'familyhub'
          - units.results[0].status.ActiveState == 'active'
          - units.results | map(attribute='status.UnitFileState') | list == ['enabled', 'enabled', 'enabled']
          - units.results[1:] | map(attribute='status.ActiveState') | list == ['active', 'active']

    - name: Read the kiosk's user
      ansible.builtin.getent:
        database: passwd
        key: kiosk

    - name: Read the kiosk's groups
      ansible.builtin.command: id --groups --name kiosk
      register: kiosk_groups
      changed_when: false

    - name: Check the kiosk's user can't log in, and can use the screen, the GPU and the touchscreen
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd.kiosk[5] == '/usr/sbin/nologin'
          - kiosk_groups.stdout.split() is superset(['video', 'render', 'input'])

    - name: Read the kiosk's and the first console's units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop: [familyhub-kiosk.service, getty@tty1.service]
      register: screen_units

    - name: Read what the Pi starts into
      ansible.builtin.command: systemctl get-default
      register: default_target
      changed_when: false

    - name: Check the Pi starts into the kiosk, as its own user, with no login prompt behind it
      ansible.builtin.assert:
        that:
          - screen_units.results[0].status.UnitFileState == 'enabled'
          - screen_units.results[0].status.User == 'kiosk'
          - screen_units.results[0].status.ExecStart is search('/usr/bin/cage -s -- /usr/local/lib/familyhub/kiosk.sh')
          - screen_units.results[1].status.UnitFileState == 'masked'
          - default_target.stdout == 'graphical.target'
