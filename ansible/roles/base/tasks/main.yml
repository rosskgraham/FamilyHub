# The home network hands out IPv6 addresses but doesn't always route IPv6 to the internet, and apt tries IPv6
# first, so downloads fail. IPv4 always works. First, so every apt run after it, the automatic updates
# included, uses IPv4.
- name: Download packages over IPv4
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/10familyhub-ipv4
    content: |
      Acquire::ForceIPv4 "true";
    owner: root
    group: root
    mode: "0644"

- name: Bring every package up to date
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Install the base packages
  ansible.builtin.apt:
    name:
      - openssh-server
      - ufw
      - unattended-upgrades
    state: present

- name: Set the time zone
  community.general.timezone:
    name: "{{ hub_timezone }}"

- name: Allow SSH by key only, and never as root
  ansible.builtin.template:
    src: sshd.conf.j2
    # 00- so it's read first: in sshd_config.d the first value set wins.
    dest: /etc/ssh/sshd_config.d/00-familyhub.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Turn on automatic updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Choose which updates install themselves, and when the Pi restarts for them
  ansible.builtin.template:
    src: unattended-upgrades.conf.j2
    dest: /etc/apt/apt.conf.d/52familyhub-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Let SSH through the firewall
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp

- name: Turn the firewall on, refusing everything else that comes in
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

# The Pi is wired only (ADR 0015): it sits inside the screen's metal housing, where the Wi-Fi barely reaches the
# router, and nothing uses Bluetooth. Switching both radios off at boot keeps a link that comes and goes from
# getting a default route beside the cable's. Under its own [all], so it applies whichever section comes before it.
- name: Switch off the Wi-Fi and Bluetooth radios
  ansible.builtin.blockinfile:
    path: "{{ hub_boot_config }}"
    marker: "# {mark} FamilyHub: wired only (ADR 0015)"
    block: |
      [all]
      dtoverlay=disable-wifi
      dtoverlay=disable-bt
  notify: Restart the Pi for its boot settings

# Earlier versions of these scripts gave the Pi the home Wi-Fi from the Key Vault.
- name: Take the old Wi-Fi settings off the Pi
  ansible.builtin.file:
    path: /etc/NetworkManager/system-connections/familyhub-wifi.nmconnection
    state: absent

# Energy-Efficient Ethernet stays off on the cable (AB#62): with it on, the Pi lost every packet for about 2
# seconds, about every 2 minutes while idle, and every request the Hub had under way timed out at once.
- name: Install ethtool, which switches Energy-Efficient Ethernet off
  ansible.builtin.apt:
    name: ethtool
    state: present

- name: Create the folder for NetworkManager's scripts
  ansible.builtin.file:
    path: /etc/NetworkManager/dispatcher.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# A restart turns Energy-Efficient Ethernet back on, so it's switched off each time the cable comes up.
- name: Switch Energy-Efficient Ethernet off whenever the cable comes up
  ansible.builtin.copy:
    src: eee-off
    dest: /etc/NetworkManager/dispatcher.d/50-familyhub-eee-off
    owner: root
    group: root
    mode: "0755"

# And now, so it needn't wait for the next time the cable comes up. The tests' stand-in has no EEE to switch.
- name: Read whether Energy-Efficient Ethernet is on
  ansible.builtin.command: ethtool --show-eee eth0
  register: base_eee
  changed_when: false
  failed_when: false
  check_mode: false

- name: Switch Energy-Efficient Ethernet off now
  ansible.builtin.command: ethtool --set-eee eth0 eee off
  when: "base_eee.stdout is search('EEE status: enabled')"
  changed_when: true
