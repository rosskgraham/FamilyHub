# Before the kiosk restarts, so cage starts without the devices it ignores. Skipped where udev isn't running, as in the
# tests' container.
- name: Apply the pointer rule
  ansible.builtin.shell: |
    test -S /run/udev/control || exit 0
    udevadm control --reload
    udevadm trigger --subsystem-match=input --action=change
    udevadm settle
  changed_when: true

- name: Restart the kiosk
  ansible.builtin.systemd_service:
    name: familyhub-kiosk.service
    state: restarted
    daemon_reload: true
  when: hub_kiosk_start
