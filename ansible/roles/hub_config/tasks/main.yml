# The Hub's secrets, from the Key Vault (ADR 0008) to /etc/familyhub on the Pi. The vault is the one place
# they're kept. The Household and Chores used to come from it too, and now live in the Hub's database
# (ADR 0012). Read on the PC, signed in with `az login`, so nothing on the Pi can reach the vault. Tagged config, so a run before the vault
# is set up can skip it with --skip-tags config.
- name: Read the Hub's secrets from the Key Vault
  ansible.builtin.command:
    argv: "{{ ['python3', role_path ~ '/files/read_key_vault.py'] + hub_config_vault_names }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  register: hub_config_key_vault

# The output above is hidden, as it holds the secrets. Problems go to stderr, which never does.
- name: Stop if the Key Vault couldn't be read
  ansible.builtin.fail:
    msg: "{{ hub_config_key_vault.stderr }}"
  when: hub_config_key_vault.rc != 0

- name: Keep what the Key Vault has
  ansible.builtin.set_fact:
    hub_config_secrets: "{{ (hub_config_key_vault.stdout | from_json).secrets }}"
  no_log: true

- name: Say which vault the secrets came from, and what it hasn't got
  ansible.builtin.debug:
    msg: >-
      From {{ (hub_config_key_vault.stdout | from_json).vault }}.
      Not in the vault, so left out: {{ missing if missing else 'nothing' }}.
  vars:
    missing: "{{ hub_config_vault_names | difference(hub_config_secrets.keys() | list) | sort }}"

# systemd reads this as root and hands it to the Hub when it starts, so the Hub's own user can't read it.
- name: Give the Hub its secrets
  ansible.builtin.template:
    src: hub.env.j2
    dest: "{{ hub_config_dir }}/hub.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart the Hub

# The home Wi-Fi, so the Pi stays on the network without its cable. Raspberry Pi OS keeps Wi-Fi switched off
# until it knows which country it's in, and the card is written without Wi-Fi (see the Pi runbook), so the
# scripts set both.
- name: Check whether the Pi has NetworkManager and raspi-config
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/usr/bin/nmcli, /usr/bin/raspi-config]
  register: hub_config_wifi_tools

- name: Keep what it has
  ansible.builtin.set_fact:
    hub_config_nmcli: "{{ hub_config_wifi_tools.results[0] }}"
    hub_config_raspi_config: "{{ hub_config_wifi_tools.results[1] }}"
    hub_config_has_wifi: "{{ hub_wifi_ssid_secret in hub_config_secrets and hub_wifi_password_secret in hub_config_secrets }}"

- name: Make the folder for NetworkManager's settings
  ansible.builtin.file:
    path: "{{ hub_config_wifi_connection | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: hub_config_has_wifi

# NetworkManager ignores settings files that anyone but root can read, which suits the password.
- name: Give the Pi the home Wi-Fi
  ansible.builtin.template:
    src: familyhub-wifi.nmconnection.j2
    dest: "{{ hub_config_wifi_connection }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: hub_config_has_wifi
  notify: Load the Wi-Fi settings

- name: Take the Wi-Fi off the Pi, as the Key Vault no longer has it
  ansible.builtin.file:
    path: "{{ hub_config_wifi_connection }}"
    state: absent
  when: not hub_config_has_wifi
  notify: Load the Wi-Fi settings

- name: Read which country the Wi-Fi is set for
  ansible.builtin.command: raspi-config nonint get_wifi_country
  register: hub_config_wifi_country
  changed_when: false
  failed_when: false
  check_mode: false
  when: hub_config_has_wifi and hub_config_raspi_config.stat.exists

- name: Set the Wi-Fi's country, which switches it on
  ansible.builtin.command: raspi-config nonint do_wifi_country {{ hub_wifi_country }}
  changed_when: true
  when:
    - hub_config_has_wifi and hub_config_raspi_config.stat.exists
    - hub_config_wifi_country.stdout | trim != hub_wifi_country
