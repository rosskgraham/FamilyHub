# Who runs the Hub, and where it keeps things. Releases come and go (ADR 0004); data and config stay put.
hub_user: familyhub
hub_home: /opt/familyhub
hub_releases_dir: /opt/familyhub/releases
hub_data_dir: /var/lib/familyhub
hub_config_dir: /etc/familyhub

hub_timezone: Europe/London
hub_node_major: 24

# Security updates install themselves, and the Pi restarts for them while the Hub is asleep (22:00 to 06:30).
hub_reboot_time: "03:30"

# The Hub listens on the Pi itself only (ADR 0002).
hub_port: 3000

# What the Hub gets from the Key Vault (ADR 0008), all optional: the Hub uses sample data for anything missing.
# Only secrets and settings that differ between environments: the Household and Chores live in the Hub's database
# (ADR 0012). Secrets go into hub.env as these variables.
hub_env_secrets:
  GOOGLE_CLIENT_ID: google-client-id
  GOOGLE_CLIENT_SECRET: google-client-secret
  NEST_PROJECT_ID: nest-project-id
  OCTOPUS_ACCOUNT: octopus-account
  OCTOPUS_API_KEY: octopus-api-key
  ZAPPI_GLO_SN: zappi-glo-sn
  ZAPPI_GLO_API_KEY: zappi-glo-api-key
  HOME_LATITUDE: home-latitude
  HOME_LONGITUDE: home-longitude

# The Pi's boot settings, where its Wi-Fi and Bluetooth are switched off (ADR 0015), and whether a change to them
# restarts the Pi straight away, as they only take effect from the next start.
hub_boot_config: /boot/firmware/config.txt
hub_restart_for_boot_settings: true

# Who shows the Hub on the screen (ADR 0009), and whether the setup scripts start it straight away. The
# tests' stand-in has no screen, so it only checks the kiosk is set up to start with the Pi.
hub_kiosk_user: kiosk
hub_kiosk_start: true

# What the screen service (AB#64) watches for touches and switches off for Lights out: the Waveshare's touch controller,
# and the HDMI port next to the power socket.
hub_touchscreen: /dev/input/by-id/usb-ILITEK_ILITEK-TOUCH-event-if00
hub_screen_output: HDMI-A-1

# Where the updater looks for the newest release (ADR 0004), how often, and how long a new release has
# to answer its health check before it's rolled back.
hub_releases_url: https://api.github.com/repos/rosskgraham/FamilyHub/releases/latest
hub_update_interval: 5min
hub_health_timeout_seconds: 90

# How often the network check looks (AB#62). The Hub's internet drops last 10 to 20 seconds, so a minute would miss most.
hub_netcheck_seconds: 5
