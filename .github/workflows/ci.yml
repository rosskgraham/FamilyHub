name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Decides whether the checks need to run. Docs, design files, the public site (site/, deployed by pages.yml) and
  # Markdown outside app/ and family-app/ aren't checked by anything here, and a docs-only merge would otherwise publish
  # a release with the same code. check, pi and backend are required by the "Protect main" ruleset, so they're skipped
  # by their own `if` rather than by skipping the workflow: a job skipped that way counts as passed, a workflow that
  # never runs never reports. app/'s and family-app/'s Markdown counts as code, because their lint formats it. The jobs
  # run unless this job said 'false', so if it fails or gives no answer they still run, rather than show as passed
  # without running. Renames are listed as a deletion and an addition, so moving a file out of app/ into docs/ still
  # counts as code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Look for anything other than docs
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # If the changed files can't be listed (a new branch, a force push), run everything.
          if ! files=$(git diff --name-only --no-renames "$BASE" "$GITHUB_SHA"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              '') ;;
              docs/* | design/* | site/*) ;;
              app/* | family-app/*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "Changed files:"; echo "$files"; echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # The same image `npm run test:screenshots` uses, so screenshots match.
    # Its version must match @playwright/test in app/package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Check types
        run: npm run check
      - name: Check formatting and lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Screenshot tests
        run: npx playwright test
        env:
          HOME: /root
      - name: Package a trial release, and check it starts
        # The same as the release job below, without publishing, so a pull request shows it works.
        run: |
          VERSION=$(date +%Y.%m.%d).0
          HUB_VERSION=$VERSION HUB_ORIGIN=http://localhost:3000 npm run build
          HUB_ORIGIN=http://localhost:3000 node scripts/release.mjs $VERSION
      - name: Keep the screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14

  # The Pi's setup scripts, run in a container standing in for the Pi.
  pi:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lint the setup scripts, run them twice, and check the result
        run: ansible/tests/run.sh

  # The family app's backend (ADR 0011): ruff's lint and formatting, then the tests. Required by the
  # "Protect main" ruleset, so a pull request can't merge with lint errors.
  backend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install, exactly as locked
        run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest

  # The family app for phones (ADR 0010): types, formatting, lint, tests, and that it builds. The Azure DevOps
  # pipeline builds it again to deploy it to Static Web Apps.
  family-app:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: family-app/package-lock.json
      - run: npm ci
      - name: Check types
        run: npm run check
      - name: Check formatting and lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  # Every merge to main that passes the checks becomes a release the Pi can pull (ADR 0004). A docs-only merge skips
  # check, and so skips this too.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One at a time, in order, so the newest merge is always the latest release.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Name the version
        id: version
        # The UK date, then the run number, so versions sort in the order they were made.
        run: echo "name=$(TZ=Europe/London date +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: npm run build
        env:
          HUB_VERSION: ${{ steps.version.outputs.name }}
          # Where the Pi's browser reaches the Hub (ADR 0002), built into the release.
          HUB_ORIGIN: http://localhost:3000
      - name: Package, and check the package starts
        run: node scripts/release.mjs ${{ steps.version.outputs.name }}
        env:
          HUB_ORIGIN: http://localhost:3000
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: >
          gh release create "v$VERSION"
          "release/familyhub-$VERSION.tar.gz" "release/familyhub-$VERSION.tar.gz.sha256"
          --target "$GITHUB_SHA" --title "FamilyHub $VERSION" --generate-notes --latest
