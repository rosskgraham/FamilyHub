<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticking off the last job of a routine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #F3F5F8; font-family: 'Figtree', system-ui, sans-serif; color: #161B22">

<div style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px">

</div>

<div style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: rgba(22, 27, 34, 0.72); display: flex; align-items: center; justify-content: center">

<section role="dialog" aria-labelledby="done-title" style="width: 1040px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 56px 64px 48px; border-radius: 40px; background: #FFFFFF; text-align: center">

<div style="position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center">
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<g stroke="#6C3FC4" stroke-width="8" stroke-linecap="round">
<line x1="100" y1="8" x2="100" y2="30"/><line x1="100" y1="170" x2="100" y2="192"/>
<line x1="8" y1="100" x2="30" y2="100"/><line x1="170" y1="100" x2="192" y2="100"/>
<line x1="35" y1="35" x2="51" y2="51"/><line x1="149" y1="149" x2="165" y2="165"/>
<line x1="35" y1="165" x2="51" y2="149"/><line x1="149" y1="51" x2="165" y2="35"/>
</g>
</svg>
<svg width="128" height="128" viewBox="0 0 24 24" fill="#F5B400" stroke="#8A5A00" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
</div>

<div style="display: flex; align-items: center; gap: 18px">
<span style="width: 72px; height: 72px; border-radius: 36px; background: #6C3FC4; color: #FFFFFF; font-size: 36px; font-weight: 700; display: flex; align-items: center; justify-content: center">L</span>
<h1 id="done-title" style="margin: 0; font-size: 76px; font-weight: 700; line-height: 1.05">Morning done, Leo!</h1>
</div>

<div style="font-size: 34px; font-weight: 600; color: #4A5565">All 3 morning jobs, ticked off</div>

<div style="display: flex; gap: 20px; margin-top: 6px">
<div style="height: 88px; padding: 0 30px; box-sizing: border-box; border-radius: 44px; background: #FFF4D6; color: #5C3D00; display: flex; align-items: center; gap: 12px; font-size: 36px; font-weight: 700">
<svg width="44" height="44" viewBox="0 0 24 24" fill="#F5B400" stroke="#8A5A00" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>+3 Stars</div>
<div style="height: 88px; padding: 0 30px; box-sizing: border-box; border-radius: 44px; background: #E6D8FA; color: #46228A; display: flex; align-items: center; gap: 12px; font-size: 36px; font-weight: 700">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#46228A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>5 mornings in a row</div>
</div>

<button style="width: 360px; height: 88px; margin-top: 14px; border-radius: 28px; border: 0; background: #161B22; color: #FFFFFF; font-size: 34px; font-weight: 700">Nice one!</button>
<div style="font-size: 22px; color: #4A5565">Closes by itself in a few seconds</div>

</section>
</div>

</div>
</x-dc>
