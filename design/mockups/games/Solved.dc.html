<div>
<div style="font-size: 80px; font-weight: 700; line-height: 1.05">You got it, Leo!</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const answer = 'PLANT';
const guesses = ['STORM', 'CLEAN', 'PLANT'];
const look = {
c: { bg: '#1F5FBF', fg: '#FFFFFF', border: '#1F5FBF' },
p: { bg: '#F08A24', fg: '#2B1600', border: '#F08A24' },
x: { bg: '#D5DAE1', fg: '#3A4350', border: '#D5DAE1' },
empty: { bg: '#FFFFFF', fg: '#161B22', border: '#E3E7ED' }
};
const score = (g) => g.split('').map((ch, i) => (answer[i] === ch ? 'c' : answer.includes(ch) ? 'p' : 'x'));
const board = guesses.map((g) => {
const s = score(g);
return g.split('').map((ch, i) => ({ ch, ...look[s[i]] }));
});
while (board.length < 6) board.push([0, 1, 2, 3, 4].map(() => ({ ch: '', ...look.empty })));
return {
board,
family: [
{ initial: 'M', solid: '#0E7C66', result: 'Got it in 4' },
{ initial: 'L', solid: '#6D3FD1', result: 'Got it in 3' },
{ initial: 'R', solid: '#B5179E', result: 'Got it in 3' },
{ initial: 'S', solid: '#A15C07', result: 'Not yet' }
]
};
}
}
</script>
