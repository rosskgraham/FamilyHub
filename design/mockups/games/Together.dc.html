<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family word of the day, taking turns</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
a{color:#161B22}a:hover{color:#161B22}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 32px; background: #F3F5F8; font-family: 'Figtree', system-ui, sans-serif; color: #161B22; display: flex; flex-direction: column; gap: 24px">

<header style="height: 128px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 32px">
<div style="display: flex; align-items: center; gap: 28px">
<div style="font-size: 112px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">18:20</div>
<div>
<div style="font-size: 44px; font-weight: 600; line-height: 1.1">Tuesday</div>
<div style="font-size: 28px; color: #4A5565; margin-top: 4px">24 November</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#161B22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
<div style="font-size: 56px; font-weight: 600; line-height: 1">5°</div>
<div>
<div style="font-size: 24px; font-weight: 600">Cloudy</div>
<div style="font-size: 22px; color: #4A5565">High 9° · Low 3°</div>
</div>
</div>
</header>

<main style="flex: 1; min-height: 0; display: flex; gap: 24px">

<section aria-label="The family's board" style="width: 720px; flex: none; box-sizing: border-box; padding: 24px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<sc-for list="{{board}}" as="row" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 64px; height: 64px; flex: none; box-sizing: border-box; margin-right: 8px; border-radius: 32px; border: 3px {{row.ring}} {{row.solid}}; background: {{row.badgeBg}}; color: #FFFFFF; font-size: 30px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{row.initial}}</span>
<sc-for list="{{row.tiles}}" as="t" hint-placeholder-count="5">
<span style="width: 104px; height: 104px; box-sizing: border-box; border-radius: 14px; border: 3px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 56px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{t.ch}}</span>
</sc-for>
</div>
</sc-for>
</section>

<section style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 32px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; gap: 20px">
<div style="flex: 1; min-width: 0">
<div style="font-size: 44px; font-weight: 700; line-height: 1.1">Family word of the day</div>
<div style="font-size: 26px; color: #4A5565; margin-top: 4px">One board for everyone. Take turns, six goes between you.</div>
</div>
<a href="Main.dc.html" style="flex: none; height: 72px; padding: 0 28px; border-radius: 36px; border: 2px solid #C9D0D9; display: flex; align-items: center; font-size: 26px; font-weight: 600; text-decoration: none">Stop for now</a>
</div>

<div>
<div style="font-size: 28px; font-weight: 700; margin-bottom: 12px">Whose go?</div>
<div style="display: flex; gap: 14px">
<sc-for list="{{players}}" as="p" hint-placeholder-count="4">
<button type="button" aria-pressed="{{p.pressed}}" style="flex: 1 1 0; height: 88px; box-sizing: border-box; padding: 0 18px; border-radius: 44px; border: 4px solid {{p.border}}; background: {{p.bg}}; display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; color: #161B22">
<span style="width: 56px; height: 56px; flex: none; border-radius: 28px; background: {{p.solid}}; color: #FFFFFF; font-size: 28px; display: flex; align-items: center; justify-content: center">{{p.initial}}</span>{{p.name}}</button>
</sc-for>
</div>
</div>

<div style="flex: 1"></div>

<div aria-label="Letters" style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<sc-for list="{{keys}}" as="kr" hint-placeholder-count="3">
<div style="display: flex; gap: 10px">
<sc-for list="{{kr}}" as="k" hint-placeholder-count="10">
<button type="button" aria-label="{{k.label}}" style="width: {{k.w}}; height: 96px; box-sizing: border-box; border-radius: 16px; border: 2px solid {{k.border}}; background: {{k.bg}}; color: {{k.fg}}; font-size: {{k.size}}; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0">{{k.text}}</button>
</sc-for>
</div>
</sc-for>
</div>

</section>

</main>

<nav style="height: 76px; flex: none; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 22px; background: #E3E7ED">
<a href="#" style="height: 64px; padding: 0 30px; border-radius: 16px; display: flex; align-items: center; font-size: 26px; font-weight: 600; text-decoration: none">Today</a>
<a href="#" style="height: 64px; padding: 0 30px; border-radius: 16px; display: flex; align-items: center; font-size: 26px; font-weight: 600; text-decoration: none">Day</a>
<a href="#" style="height: 64px; padding: 0 30px; border-radius: 16px; display: flex; align-items: center; font-size: 26px; font-weight: 600; text-decoration: none">Week</a>
<a href="#" style="height: 64px; padding: 0 30px; border-radius: 16px; display: flex; align-items: center; font-size: 26px; font-weight: 600; text-decoration: none">Shopping</a>
<a href="#" style="height: 64px; padding: 0 30px; border-radius: 16px; display: flex; align-items: center; font-size: 26px; font-weight: 600; text-decoration: none">To-dos</a>
<a href="#" style="height: 64px; padding: 0 30px; border-radius: 16px; display: flex; align-items: center; font-size: 26px; font-weight: 600; text-decoration: none">Chores</a>
<a href="#" style="height: 64px; padding: 0 30px; border-radius: 16px; display: flex; align-items: center; font-size: 26px; font-weight: 600; text-decoration: none">Energy</a>
<a href="Main.dc.html" aria-current="page" style="height: 64px; padding: 0 30px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; font-size: 26px; font-weight: 600; text-decoration: none">Games</a>
<a href="#" aria-label="Settings" style="width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#161B22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
</div>
<div style="height: 56px; padding: 0 24px; border-radius: 28px; border: 2px dashed #C9D0D9; display: flex; align-items: center; font-size: 24px; color: #2E3644">Sample data</div>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const answer = 'PLANT';
const people = {
M: { name: 'Maya', solid: '#0E7C66' },
L: { name: 'Leo', solid: '#6D3FD1' },
R: { name: 'Ross', solid: '#B5179E' },
S: { name: 'Sam', solid: '#A15C07' }
};
const goes = [{ who: 'M', word: 'STORM' }, { who: 'L', word: 'CLEAN' }];
const typing = { who: 'S', word: 'PL' };
const look = {
c: { bg: '#1F5FBF', fg: '#FFFFFF', border: '#1F5FBF' },
p: { bg: '#F08A24', fg: '#2B1600', border: '#F08A24' },
x: { bg: '#D5DAE1', fg: '#3A4350', border: '#D5DAE1' },
typed: { bg: '#FFFFFF', fg: '#161B22', border: '#161B22' },
empty: { bg: '#FFFFFF', fg: '#161B22', border: '#D5DAE1' }
};
const score = (g) => g.split('').map((ch, i) => (answer[i] === ch ? 'c' : answer.includes(ch) ? 'p' : 'x'));
const badge = (who) => ({ initial: who, solid: people[who].solid, badgeBg: people[who].solid, ring: 'solid' });
const blank = { initial: '', solid: '#D5DAE1', badgeBg: '#FFFFFF', ring: 'dashed' };
const known = {};
const rank = { c: 3, p: 2, x: 1 };
const board = goes.map((g) => {
const s = score(g.word);
g.word.split('').forEach((ch, i) => { if (!known[ch] || rank[s[i]] > rank[known[ch]]) known[ch] = s[i]; });
return { ...badge(g.who), tiles: g.word.split('').map((ch, i) => ({ ch, ...look[s[i]] })) };
});
board.push({ ...badge(typing.who), tiles: [0, 1, 2, 3, 4].map((i) => (typing.word[i] ? { ch: typing.word[i], ...look.typed } : { ch: '', ...look.empty })) });
while (board.length < 6) board.push({ ...blank, tiles: [0, 1, 2, 3, 4].map(() => ({ ch: '', ...look.empty })) });
const players = Object.keys(people).map((k) => ({
initial: k, name: people[k].name, solid: people[k].solid,
pressed: k === typing.who ? 'true' : 'false',
border: k === typing.who ? people[k].solid : '#E3E7ED',
bg: k === typing.who ? '#FBEFDF' : '#FFFFFF'
}));
const keyLook = {
c: { bg: '#1F5FBF', fg: '#FFFFFF', border: '#1F5FBF' },
p: { bg: '#F08A24', fg: '#2B1600', border: '#F08A24' },
x: { bg: '#FFFFFF', fg: '#9AA3B0', border: '#E3E7ED' },
none: { bg: '#E3E7ED', fg: '#161B22', border: '#E3E7ED' }
};
const letter = (ch) => ({ text: ch, label: ch, w: '96px', size: '38px', ...keyLook[known[ch] || 'none'] });
const keys = ['QWERTYUIOP', 'ASDFGHJKL'].map((r) => r.split('').map(letter));
keys.push([
{ text: 'Check', label: 'Check this word', w: '150px', size: '28px', bg: '#161B22', fg: '#FFFFFF', border: '#161B22' },
...'ZXCVBNM'.split('').map(letter),
{ text: '⌫', label: 'Delete a letter', w: '150px', size: '36px', ...keyLook.none }
]);
return { board, players, keys };
}
}
</script>
</body>
</html>
