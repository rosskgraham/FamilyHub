<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lanes by person</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 32px; background: #0E1116; font-family: 'Figtree', system-ui, sans-serif; color: #F2F4F8; display: flex; flex-direction: column; gap: 24px">

<header style="height: 128px; display: flex; align-items: center; justify-content: space-between; gap: 32px">
<div style="display: flex; align-items: center; gap: 28px">
<div style="font-size: 112px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">07:18</div>
<div>
<div style="font-size: 44px; font-weight: 600; line-height: 1.1">Wednesday</div>
<div style="font-size: 28px; color: #A6B0BF; margin-top: 4px">21 October</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#F2F4F8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="16" y1="13" x2="16" y2="21"/><line x1="8" y1="13" x2="8" y2="21"/><line x1="12" y1="15" x2="12" y2="23"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>
<div style="font-size: 56px; font-weight: 600; line-height: 1">11°</div>
<div>
<div style="font-size: 24px; font-weight: 600">Light rain</div>
<div style="font-size: 22px; color: #A6B0BF">High 13° · Low 8°</div>
</div>
</div>
</header>

<main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px">

<div style="height: 64px; flex: none; display: flex; gap: 10px">
<div style="width: 190px; flex: none"></div>
<sc-for list="{{heads}}" as="h" hint-placeholder-count="7">
<div style="flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: 18px; background: {{h.bg}}; color: {{h.fg}}">
<span style="font-size: 28px; font-weight: 700">{{h.name}}</span>
<span style="font-size: 40px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums">{{h.num}}</span>
</div>
</sc-for>
</div>

<div style="flex: none; display: flex; gap: 10px">
<div style="width: 190px; flex: none; box-sizing: border-box; display: flex; align-items: center; padding: 0 20px; border-radius: 20px; background: #171C24; font-size: 26px; font-weight: 700">Everyone</div>
<sc-for list="{{strip}}" as="cell" hint-placeholder-count="7">
<div style="flex: 1 1 0; min-width: 0; min-height: 64px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 8px; border-radius: 20px; background: {{cell.bg}}">
<sc-for list="{{cell.events}}" as="ev" hint-placeholder-count="1">
<div style="padding: 9px 12px; border-radius: 12px; background: {{ev.bg}}; color: {{ev.fg}}; font-size: 21px; font-weight: 600; line-height: 1.2"><span style="font-weight: 700; font-variant-numeric: tabular-nums">{{ev.time}}</span> {{ev.title}}</div>
</sc-for>
</div>
</sc-for>
</div>

<sc-for list="{{lanes}}" as="lane" hint-placeholder-count="4">
<div style="flex: 1 1 0; min-height: 0; display: flex; gap: 10px">
<div style="width: 190px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-radius: 20px; background: #171C24">
<span style="width: 56px; height: 56px; border-radius: 28px; background: {{lane.solid}}; color: {{lane.on}}; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{lane.who}}</span>
<span style="font-size: 24px; font-weight: 700">{{lane.name}}</span>
</div>
<sc-for list="{{lane.cells}}" as="cell" hint-placeholder-count="7">
<div style="flex: 1 1 0; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 20px; background: {{cell.bg}}">
<sc-for list="{{cell.events}}" as="ev" hint-placeholder-count="1">
<div style="padding: 9px 12px; border-radius: 12px; background: {{ev.bg}}; color: {{ev.fg}}; font-size: 21px; font-weight: 600; line-height: 1.2"><span style="font-weight: 700; font-variant-numeric: tabular-nums">{{ev.time}}</span> {{ev.title}}</div>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>

</main>

<footer style="height: 96px; display: flex; align-items: center; justify-content: space-between; gap: 24px">
<div style="display: flex; align-items: center; gap: 12px">
<button aria-label="Previous week" style="width: 72px; height: 72px; border-radius: 20px; border: 2px solid #3A4553; background: #171C24; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F2F4F8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
<div style="min-width: 280px; text-align: center">
<div style="font-size: 28px; font-weight: 700">This week</div>
<div style="font-size: 22px; color: #A6B0BF">19–25 October</div>
</div>
<button aria-label="Next week" style="width: 72px; height: 72px; border-radius: 20px; border: 2px solid #3A4553; background: #171C24; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F2F4F8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
</div>

<div style="display: flex; padding: 6px; gap: 6px; border-radius: 26px; background: #1F2630">
<button style="width: 132px; height: 60px; border-radius: 20px; border: 0; background: transparent; color: #F2F4F8; font-size: 24px; font-weight: 600">Day</button>
<button style="width: 132px; height: 60px; border-radius: 20px; border: 0; background: #3A4553; color: #FFFFFF; font-size: 24px; font-weight: 700">Week</button>
<button style="width: 132px; height: 60px; border-radius: 20px; border: 0; background: transparent; color: #F2F4F8; font-size: 24px; font-weight: 600">Month</button>
</div>

<div style="display: flex; align-items: center; gap: 16px">
<div style="height: 56px; padding: 0 22px 0 18px; border-radius: 28px; background: #171C24; border: 2px solid #3A4553; display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 600">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F4F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>Alexa linked</div>
<button style="height: 72px; padding: 0 28px; border-radius: 22px; border: 2px solid #3A4553; background: #171C24; color: #F2F4F8; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F2F4F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>Shopping
<span style="min-width: 36px; height: 36px; padding: 0 8px; box-sizing: border-box; border-radius: 18px; background: #F2F4F8; color: #0E1116; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center">7</span></button>
<button style="height: 72px; padding: 0 28px; border-radius: 22px; border: 2px solid #3A4553; background: #171C24; color: #F2F4F8; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px"><svg width="30" height="30" viewBox="0 0 24 24" fill="#F2F4F8" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"/></svg>Watch</button>
<button style="height: 72px; padding: 0 32px; border-radius: 22px; border: 0; background: #F2F4F8; color: #0E1116; font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 12px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1116" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add event</button>
</div>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const C = {
      D: { bg: '#1C2B52', fg: '#C4D6FF' },
      M: { bg: '#4A2A0E', fg: '#FFD8B0' },
      E: { bg: '#0F3B31', fg: '#A9EEDA' },
      N: { bg: '#33235F', fg: '#E0D2FF' },
      F: { bg: '#2A313C', fg: '#DCE1EA' }
    };
    const e = (time, title, p) => ({ time: time, title: title, bg: C[p].bg, fg: C[p].fg });
    const states = ['past', 'past', 'today', 'future', 'future', 'future', 'future'];
    const cellBg = { past: '#12161C', today: '#212A36', future: '#171C24' };
    const row = (perDay) => perDay.map((evs, i) => ({ bg: cellBg[states[i]], events: evs }));
    const lane = (who, name, solid, on, perDay) => ({ who: who, name: name, solid: solid, on: on, cells: row(perDay) });
    const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const nums = ['19', '20', '21', '22', '23', '24', '25'];
    return {
      heads: names.map((n, i) => ({
        name: n,
        num: nums[i],
        bg: states[i] === 'today' ? '#F2F4F8' : 'transparent',
        fg: states[i] === 'today' ? '#0E1116' : (states[i] === 'past' ? '#A6B0BF' : '#F2F4F8')
      })),
      strip: row([
        [], [], [],
        [e('', 'Bin day', 'F')],
        [e('19:30', 'Takeaway night', 'F')],
        [],
        [e('', 'Clocks go back', 'F'), e('12:30', 'Lunch at Gran’s', 'F')]
      ]),
      lanes: [
        lane('A', 'Alex', '#7FA8FF', '#0B1A3F', [
          [], [e('09:00', 'Team offsite', 'D')], [], [e('18:00', 'Five-a-side', 'D')], [], [e('19:00', 'Date night', 'D')], []
        ]),
        lane('S', 'Sam', '#FFA85C', '#3A1800', [
          [], [], [e('07:45', 'School run', 'M'), e('10:00', 'Boiler service', 'M'), e('19:00', 'Book club', 'M')], [], [], [], [e('16:00', 'Garden tidy', 'M')]
        ]),
        lane('M', 'Maya', '#5ED6B5', '#04281F', [
          [e('16:00', 'Swimming', 'E')], [], [e('16:30', 'Piano lesson', 'E')], [e('17:00', 'Swimming', 'E')], [], [e('14:00', 'Birthday party', 'E')], []
        ]),
        lane('L', 'Leo', '#B99BFF', '#24104D', [
          [e('18:30', 'Cubs', 'N')], [e('17:30', 'Football training', 'N')], [], [], [e('15:30', 'Dentist', 'N')], [e('09:30', 'Football match', 'N')], []
        ])
      ]
    };
  }
}
</script>
</body>
</html>
