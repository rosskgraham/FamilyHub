<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meals, saved meals only</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
a{color:#161B22}a:hover{color:#161B22}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 32px; background: #F3F5F8; font-family: 'Figtree', system-ui, sans-serif; color: #161B22; display: flex; flex-direction: column; gap: 24px">

<header style="height: 128px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 32px">
<div style="display: flex; align-items: center; gap: 28px">
<div style="font-size: 112px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">17:05</div>
<div>
<div style="font-size: 44px; font-weight: 600; line-height: 1.1">Friday</div>
<div style="font-size: 28px; color: #4A5565; margin-top: 4px">27 November</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#161B22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
<div style="font-size: 56px; font-weight: 600; line-height: 1">6°</div>
<div>
<div style="font-size: 24px; font-weight: 600">Cloudy</div>
<div style="font-size: 22px; color: #4A5565">High 8° · Low 2°</div>
</div>
</div>
</header>

<main style="flex: 1; min-height: 0; display: flex; gap: 24px">

<section style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
<div style="display: flex; align-items: baseline; gap: 16px">
<div style="font-size: 36px; font-weight: 700">Saved meals</div>
<div style="font-size: 22px; color: #4A5565">12 meals · tap one to edit</div>
</div>
<a href="b-edit.dc.html" style="height: 64px; padding: 0 28px; border-radius: 32px; background: #1F5FBF; color: #FFFFFF; font-size: 26px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
Add meal</a>
</div>
<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 12px">
<sc-for list="{{meals}}" as="m" hint-placeholder-count="12">
<a href="b-edit.dc.html" style="box-sizing: border-box; padding: 0 22px; border-radius: 18px; background: #F3F5F8; color: #161B22; text-decoration: none; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0">
<span style="font-size: 28px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.name}}</span>
<span style="font-size: 20px; color: #4A5565; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.detail}}</span>
</a>
</sc-for>
</div>
</section>

</main>

<nav style="height: 76px; flex: none; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 22px; background: #E3E7ED">

</div>
<div style="height: 56px; padding: 0 24px; border-radius: 28px; border: 2px dashed #C9D0D9; display: flex; align-items: center; font-size: 24px; color: #2E3644">Sample data</div>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const meal = (name, ingredients) => ({
name,
detail: ingredients.length ? `${ingredients.length} ingredients · ${ingredients.slice(0, 3).join(', ')}…` : 'No ingredients'
});
return {
meals: [
meal('Chicken curry', ['chicken thighs', 'onions', 'curry paste', 'coconut milk', 'rice', 'naan']),
meal('Chilli con carne', ['beef mince', 'kidney beans', 'chopped tomatoes', 'onions', 'peppers', 'rice', 'sour cream', 'cheddar']),
meal('Fajitas', ['chicken breasts', 'peppers', 'onions', 'wraps', 'fajita seasoning', 'salsa', 'sour cream']),
meal('Fish pie', ['fish pie mix', 'potatoes', 'milk', 'butter', 'peas', 'cheddar']),
meal('Lasagne', ['beef mince', 'lasagne sheets', 'passata', 'onions', 'carrots', 'milk', 'cheddar']),
meal('Pasta bake', ['penne', 'passata', 'mozzarella', 'peppers', 'sweetcorn']),
meal('Roast chicken', ['whole chicken', 'potatoes', 'carrots', 'broccoli', 'gravy granules', 'stuffing']),
meal('Sausage and mash', ['sausages', 'potatoes', 'peas', 'gravy granules', 'butter']),
meal('Shepherd’s pie', ['lamb mince', 'potatoes', 'onions', 'carrots', 'peas', 'stock cubes']),
meal('Spaghetti bolognese', ['beef mince', 'spaghetti', 'chopped tomatoes', 'onions', 'garlic', 'parmesan']),
meal('Stir fry', ['noodles', 'stir fry veg', 'chicken breasts', 'soy sauce']),
meal('Takeaway', [])
]
};
}
}
</script>
</body>
</html>
