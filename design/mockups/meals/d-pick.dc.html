<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picking a meal for Tuesday</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
a{color:#161B22}a:hover{color:#161B22}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #6B7380; font-family: 'Figtree', system-ui, sans-serif; color: #161B22">

<div style="position: absolute; left: 32px; top: 32px; right: 32px; bottom: 32px; box-sizing: border-box; padding: 36px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 28px" role="dialog" aria-label="Dinner on Tuesday 1 December">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
<div>
<div style="font-size: 24px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5565">Tuesday 1 December</div>
<div style="font-size: 48px; font-weight: 700; line-height: 1.15">What's for dinner?</div>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<button style="height: 64px; padding: 0 28px; border-radius: 32px; border: 2px dashed #8A94A3; background: #FFFFFF; color: #161B22; font-size: 24px; font-weight: 700; cursor: pointer">Nothing planned</button>
<a href="a-meals.dc.html" style="height: 64px; padding: 0 28px; border-radius: 32px; background: #E3E7ED; color: #161B22; font-size: 24px; font-weight: 700; text-decoration: none; display: flex; align-items: center">Cancel</a>
</div>
</div>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 16px">
<sc-for list="{{meals}}" as="m" hint-placeholder-count="12">
<a href="a-meals.dc.html" aria-current="{{m.current}}" style="box-sizing: border-box; padding: 0 24px; border-radius: 20px; border: {{m.border}}; background: {{m.bg}}; color: #161B22; text-decoration: none; display: flex; align-items: center; gap: 16px; min-width: 0">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 32px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.name}}</span>
<span style="font-size: 22px; color: #4A5565">{{m.detail}}</span>
</span>
<sc-if value="{{m.planned}}" hint-placeholder-val="{{false}}">
<span style="flex: none; height: 40px; padding: 0 14px; border-radius: 20px; background: #1F5FBF; color: #FFFFFF; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg>Planned</span>
</sc-if>
</a>
</sc-for>
<a href="b-edit.dc.html" style="box-sizing: border-box; padding: 0 24px; border-radius: 20px; border: 2px dashed #C9D0D9; background: #FFFFFF; color: #1F5FBF; text-decoration: none; font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 12px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F5FBF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New meal</a>
</div>

<div style="font-size: 22px; color: #4A5565">Tap a meal to plan it for Tuesday. More meals scroll.</div>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const meal = (name, count, planned) => ({
name, planned,
current: planned ? 'true' : 'false',
detail: count ? `${count} ingredients` : 'No ingredients',
bg: planned ? '#E8EFFB' : '#F3F5F8',
border: planned ? '3px solid #1F5FBF' : '3px solid transparent'
});
return {
meals: [
meal('Chicken curry', 6), meal('Chilli con carne', 8), meal('Fajitas', 7), meal('Fish pie', 6),
meal('Lasagne', 7), meal('Pasta bake', 5), meal('Roast chicken', 6), meal('Sausage and mash', 5),
meal('Shepherd’s pie', 6), meal('Spaghetti bolognese', 6, true), meal('Stir fry', 4), meal('Takeaway', 0)
]
};
}
}
</script>
</body>
</html>
