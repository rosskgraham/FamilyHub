<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Calendar Mockups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
body { margin: 0; padding: 32px 16px; background: #F3F5F8; color: #161B22; font-family: 'Figtree', system-ui, sans-serif; }
main { max-width: 1400px; margin: 0 auto; }
h1 { font-size: 32px; margin: 0 0 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 24px; }
a { color: inherit; text-decoration: none; font-weight: 600; font-size: 18px; display: flex; flex-direction: column; gap: 10px; }
.frame { aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .15); }
a:hover .frame { box-shadow: 0 0 0 3px #161B22; }
iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
</style>
</head>
<body>
<main>
<h1>Kitchen Calendar Mockups</h1>
<div class="grid">
<a href="Main.html"><div class="frame"><iframe src="Main.html" tabindex="-1" loading="lazy"></iframe></div><span>A · Week columns</span></a>
<a href="Lanes.html"><div class="frame"><iframe src="Lanes.html" tabindex="-1" loading="lazy"></iframe></div><span>B · Lanes by person</span></a>
<a href="Today.html"><div class="frame"><iframe src="Today.html" tabindex="-1" loading="lazy"></iframe></div><span>C · Today + shopping list</span></a>
<a href="Sleep.html"><div class="frame"><iframe src="Sleep.html" tabindex="-1" loading="lazy"></iframe></div><span>D · Sleep mode (motion sensor)</span></a>
<a href="Watch.html"><div class="frame"><iframe src="Watch.html" tabindex="-1" loading="lazy"></iframe></div><span>E · Watch YouTube</span></a>
</div>
</main>
</body>
</html>
