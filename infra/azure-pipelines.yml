# Deploys everything FamilyHub has in Azure from infra/main.bicep, at the scope of its own FamilyHub
# subscription, resource group included (ADR 0008), then the family app's backend from backend/ to its function
# app (ADR 0011), and the family app from family-app/ to Static Web Apps (ADR 0010). A pull request gets a lint, a
# what-if, which lists what the merge would change, and the backend's and family app's tests; a merge to main deploys. Setup, including the service connection, variable group and
# environment named below, is in docs/runbooks/azure-setup.md.

trigger:
  branches:
    include: [main]
  paths:
    include: [infra, backend, family-app]

pr:
  branches:
    include: [main]
  paths:
    include: [infra, backend, family-app]

variables:
  # FAMILYHUB_ADMIN_OBJECT_ID and FAMILYHUB_BUDGET_EMAIL, which main.bicepparam reads, and the sign-in tenant's
  # FAMILYHUB_ENTRA_TENANT_ID, FAMILYHUB_ENTRA_SUBDOMAIN, FAMILYHUB_API_CLIENT_ID and FAMILYHUB_APP_CLIENT_ID. Kept out
  # of the public repo.
  - group: familyhub
  - name: serviceConnection
    value: familyhub-azure
  - name: location
    value: uksouth
  - name: resourceGroup
    value: rg-familyhub

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Check
    jobs:
      - job: Check
        steps:
          - checkout: self

          - script: |
              set -euo pipefail
              az bicep install
              az bicep lint --file infra/main.bicep
              az bicep build-params --file infra/main.bicepparam --stdout > /dev/null
            displayName: Lint the Bicep

          - task: UsePythonVersion@0
            displayName: Use Python 3.12, as the function app does
            inputs:
              versionSpec: '3.12'

          - script: |
              set -euo pipefail
              pip install --quiet uv
              cd backend
              uv sync --frozen
              uv run ruff check .
              uv run ruff format --check .
              uv run pytest
            displayName: Test the backend

          # Flex builds the app itself from requirements.txt (a remote build), so the package is just the source.
          - script: |
              set -euo pipefail
              cd backend
              uv export --frozen --no-dev --no-hashes --no-emit-project --output-file requirements.txt
              zip -r "$(Build.ArtifactStagingDirectory)/backend.zip" \
                function_app.py host.json requirements.txt familyhub_api -x '*__pycache__*'
            displayName: Package the backend

          - publish: $(Build.ArtifactStagingDirectory)/backend.zip
            artifact: backend
            displayName: Keep the backend package for the deploy

          - task: UseNode@1
            displayName: Use Node 24, as CI does
            inputs:
              version: '24.x'

          - script: |
              set -euo pipefail
              cd family-app
              npm ci --no-audit --no-fund
              npm run check
              npm run lint
              npm test
              npm run build
            displayName: Test and build the family app

          # Pull requests from forks of the public repo never get near the subscription.
          - task: AzureCLI@2
            displayName: Show what deploying would change
            condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))
            inputs:
              azureSubscription: ${{ variables.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                infra/register-providers.sh
                az deployment sub what-if \
                  --location "$(location)" \
                  --template-file infra/main.bicep \
                  --parameters infra/main.bicepparam

  - stage: Deploy
    dependsOn: Check
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: Deploy
        environment: familyhub-azure
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # A deployment job also downloads the Check stage's backend package, to $(Pipeline.Workspace)/backend.
                - task: AzureCLI@2
                  displayName: Deploy the resources
                  name: resources
                  inputs:
                    azureSubscription: ${{ variables.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      infra/register-providers.sh
                      outputs=$(az deployment sub create \
                        --name "familyhub-$(Build.BuildId)" \
                        --location "$(location)" \
                        --template-file infra/main.bicep \
                        --parameters infra/main.bicepparam \
                        --query properties.outputs --output json)
                      echo "$outputs"
                      echo "##vso[task.setvariable variable=functionAppName]$(jq -r .functionAppName.value <<< "$outputs")"
                      echo "##vso[task.setvariable variable=apiUrl]$(jq -r .apiUrl.value <<< "$outputs")"
                      echo "##vso[task.setvariable variable=familyAppName]$(jq -r .familyAppName.value <<< "$outputs")"
                      echo "##vso[task.setvariable variable=familyAppUrl]$(jq -r .familyAppUrl.value <<< "$outputs")"

                - task: AzureCLI@2
                  displayName: Deploy the backend
                  inputs:
                    azureSubscription: ${{ variables.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az functionapp deployment source config-zip \
                        --resource-group "$(resourceGroup)" \
                        --name "$(functionAppName)" \
                        --src "$(Pipeline.Workspace)/backend/backend.zip" \
                        --build-remote true

                # The app is built here rather than in the Check stage, as its settings include the API's address, which
                # the resources step has only just given (AB#56). They come from the familyhub variable group and the
                # Bicep's outputs, and none is secret. A missing one leaves the app saying sign-in isn't set up.
                - task: UseNode@1
                  displayName: Use Node 24, as CI does
                  inputs:
                    version: '24.x'

                - script: |
                    set -euo pipefail
                    cd family-app
                    npm ci --no-audit --no-fund
                    npm run build
                  displayName: Build the family app with its settings
                  env:
                    VITE_FAMILYHUB_ENTRA_TENANT_ID: $(FAMILYHUB_ENTRA_TENANT_ID)
                    VITE_FAMILYHUB_ENTRA_SUBDOMAIN: $(FAMILYHUB_ENTRA_SUBDOMAIN)
                    VITE_FAMILYHUB_APP_CLIENT_ID: $(FAMILYHUB_APP_CLIENT_ID)
                    VITE_FAMILYHUB_API_URL: $(apiUrl)

                # The deployment token is read here and used straight away, so it's never stored: not in the repo, not
                # in the variable group. The CLI only uploads the files built above.
                - task: AzureCLI@2
                  displayName: Deploy the family app
                  inputs:
                    azureSubscription: ${{ variables.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      token=$(az staticwebapp secrets list \
                        --name "$(familyAppName)" --resource-group "$(resourceGroup)" \
                        --query properties.apiKey --output tsv)
                      echo "##vso[task.setsecret]$token"
                      npx --yes @azure/static-web-apps-cli@2.1.0 deploy family-app/build \
                        --deployment-token "$token" --env production
                      curl --fail --silent --show-error --max-time 30 --output /dev/null "$(familyAppUrl)/"
                      echo "The family app is at $(familyAppUrl)"

                # The first request after a deploy is a cold start, so it gets a couple of minutes.
                - script: |
                    set -euo pipefail
                    for attempt in $(seq 1 12); do
                      if curl --fail --silent --show-error --max-time 30 "$(apiUrl)/health"; then
                        echo
                        exit 0
                      fi
                      echo "Not answering yet (attempt $attempt)"
                      sleep 10
                    done
                    echo "##vso[task.logissue type=error]The API didn't answer /health after deploying."
                    exit 1
                  displayName: Check the API answers
