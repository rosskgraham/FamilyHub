[project]
name = "familyhub-api"
version = "0.1.0"
description = "The family app's backend: a FastAPI app run by Azure Functions Flex Consumption (ADR 0011)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-functions>=1.26.0",
    "fastapi>=0.163.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
